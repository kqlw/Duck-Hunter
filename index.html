<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/animation.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="icon" href="img/document__icon.png">

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">


    <title>Duck hunter</title>
</head>
<body>
 
<section class="menu">
    <!-- логоитип -->
    <div class="menu__logo">DUCK HUNTER</div>

    <!-- деньги -->
    <div class="money">
        <div class="money__value"></div>$
    </div>

    <!-- кнопка настроек -->
    <div class="menu__settingsBTN"></div>
</section>


<!-- настройки -->
<div class="settings">
    <!-- заголовок -->
    <h1 class="settings__title">
        Уровень сложности
    </h1>
    <!-- !заголовок -->

    <!-- кнопики уровней сложности -->
    <button class="BTN__lvlComplexity" id="BTN__lvlComplexity--eazy">лёгкий</button>
    <button class="BTN__lvlComplexity" id="BTN__lvlComplexity--medium">средний</button>
    <button class="BTN__lvlComplexity" id="BTN__lvlComplexity--hard">тяжёлый</button>
    <!-- !кнопики уровней сложности -->

    <!-- ползунок громкости -->
    <div class="settings__volume">
        <div class="volume__title">Громкость музыки</div>
        <div class="volume__circle"></div>
        <div class="volume__line"></div>
    </div>
    <!-- !ползунок громкости -->

</div>
<!-- !настройки -->




<!-- игровая обаласть -->
<section class="gameArea">



</section>
<!-- !игровая обаласть -->





<!-- магазин -->

<section class="shop">

    <div class="shopElement">

        <h2 class="shopElement__title"> GLOCK </h2>

        <img src="img\glock.png" alt="" class="shopElement__img">

        <button class="shopElement__BTN">купить - <span class="shopElement__BTN__cost">200$</span></button>
    </div>


    <div class="shopElement">

        <h2 class="shopElement__title">REMINGTON 870 </h2>

        <img src="img\gun_shotgun.png" alt="" class="shopElement__img">

        <button class="shopElement__BTN">купить - <span class="shopElement__BTN__cost">200$</span></button>
    </div>


</section>


<!-- !магазин -->







    <script src="JS/main.js"></script>
</body>
</html>
